# Docker Compose Configuration for Langa Dashboard
# Standalone frontend deployment - communicates with backend API via HTTP/HTTPS

services:
  langa-dashboard:
    image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/langa-dashboard:latest
    container_name: langa-dashboard
    restart: unless-stopped
    platform: linux/amd64
    
    # Port mapping
    ports:
      - "${APP_PORT:-3000}:80"
    
    # Environment variables
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - NODE_ENV=production
    
    # Resource limits (adjust based on VPS capacity)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Note: If using Nginx reverse proxy, no additional labels needed.
    # Nginx will proxy to this container on port 3000 (or APP_PORT).
