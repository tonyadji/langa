# Deploy the Langa dashboard (frontend) to Railway.
#
# Railway builds frontend/Dockerfile itself from the uploaded sources (`railway up`).
#
# Secrets:
#   RAILWAY_TOKEN                      Railway project token (Project settings > Tokens),
#                                      created for the target environment
#
# Variables (Settings > Secrets and variables > Actions > Variables):
#   RAILWAY_SERVICE                    Name or ID of the frontend service (default langa-dashboard)
#   RAILWAY_FRONTEND_URL               Public URL of the service, used for the health check (optional),
#                                      e.g. https://langa-dashboard.up.railway.app
#
# Railway service variables (Railway dashboard > service > Variables). Railway passes them to the
# Dockerfile as build args, and Vite bakes them into the static files at build time:
#   VITE_API_BASE_URL                  Backend API URL, e.g. https://api.example.com/api
#   VITE_AUTH_PROVIDER                 Identity provider (default entra)
#   VITE_ENTRA_CLIENT_ID               "langa-spa" application (client) ID
#   VITE_ENTRA_AUTHORITY               https://<tenant-subdomain>.ciamlogin.com/<tenant-id>/
#   VITE_ENTRA_API_SCOPE               api://<langa-api client id>/access_as_user
#   PORT=80                            nginx listens on port 80
#
# The production URL of the frontend must be declared as a redirect URI of the SPA app registration.

name: Frontend deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: frontend-deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test -- --run

  deploy-to-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.RAILWAY_FRONTEND_URL }}
    defaults:
      run:
        working-directory: frontend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'langa-dashboard' }}
      RAILWAY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret RAILWAY_TOKEN is not set"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        # --path-as-root uploads only frontend/ (by default the CLI uploads the whole git repository,
        # and Railway would then build the root Dockerfile, i.e. the backend).
        # --ci streams the build logs and fails the job if the Railway build fails.
        run: railway up . --path-as-root --ci --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"

      - name: Health check
        if: vars.RAILWAY_FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ vars.RAILWAY_FRONTEND_URL }}
        run: |
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${FRONTEND_URL%/}/health" || true)
            if [ "$code" = "200" ]; then
              echo "Application is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for the application (HTTP $code)..."
            sleep 5
          done
          echo "::error::Health check failed"
          exit 1
