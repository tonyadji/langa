spring:
  application:
    name: ${APP_NAME}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE}
            required: ${MAIL_STARTTLS_REQUIRED}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET}
      key-deserializer: ${KAFKA_KEY_DESERIALIZER}
      value-deserializer: ${KAFKA_VALUE_DESERIALIZER}
      enable-auto-commit: ${KAFKA_ENABLE_AUTO_COMMIT}
      properties:
        spring.json.trusted.packages: ${KAFKA_TRUSTED_PACKAGES}
    listener:
      ack-mode: ${KAFKA_LISTENER_ACK_MODE}

server:
  port: ${SERVER_PORT}
  tomcat:
    max-http-form-post-size: ${TOMCAT_MAX_FORM_POST_SIZE}

application:
  agent-version: ${AGENT_VERSION}
  base-url: ${BASE_URL}
  front-url: ${FRONT_URL}
  ingestion:
    kafka-url: ${spring.kafka.bootstrap-servers}
    kafka-topic: ${KAFKA_TOPIC}
    endpoint: ${INGESTION_ENDPOINT}
  persistence:
    provider: ${PERSISTENCE_PROVIDER}
  security:
    # OIDC identity provider; defaults are those of Microsoft Entra External ID (see README for Cognito)
    auth:
      provider: ${AUTH_PROVIDER:entra}
      issuer-uri: ${AUTH_ISSUER_URI}
      jwk-set-uri: ${AUTH_JWK_SET_URI}
      audience-claim: ${AUTH_AUDIENCE_CLAIM:aud}
      audiences: ${AUTH_AUDIENCES}
      scope-claim: ${AUTH_SCOPE_CLAIM:scp}
      required-scope: ${AUTH_REQUIRED_SCOPE:access_as_user}
      required-claims: ${AUTH_REQUIRED_CLAIMS:}
      subject-claim: ${AUTH_SUBJECT_CLAIM:oid}
      email-source: ${AUTH_EMAIL_SOURCE:claim}
      email-claim: ${AUTH_EMAIL_CLAIM:email}
      userinfo-uri: ${AUTH_USERINFO_URI:}
    endpoints:
      unsecured: ${SECURITY_UNSECURED_ENDPOINTS}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}
      allowed-headers: ${CORS_ALLOWED_HEADERS}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS}
      pattern-registry: ${CORS_PATTERN_REGISTRY}
  mail:
    provider: ${MAIL_PROVIDER}

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY}
    com.langa: ${LOG_LEVEL_LANGA}
    org.apache.kafka: ${LOG_LEVEL_KAFKA:OFF}

management:
  endpoints:
    web:
      exposure:
        include:
         - health
         - info
         - metrics
         - langaMetrics
         - langaConfig
    health:
      show-details: always